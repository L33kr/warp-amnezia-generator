<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Генератор Cloudflare WARP WireGuard-конфигураций для AmneziaVPN." />
  <title>WARP → AmneziaVPN</title>
  <link rel="stylesheet" href="/style.css?v=20260910-minimal1" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <h1>WARP → AmneziaVPN</h1>
      <p>Генератор WireGuard-профиля Cloudflare WARP для AmneziaVPN.</p>
    </header>

    <section class="card">
      <div class="grid two">
        <label>Режим маршрутизации
          <select id="routeMode">
            <option value="full">IPv4 + IPv6</option>
            <option value="ipv4">Только IPv4</option>
          </select>
        </label>

        <label>DNS
          <select id="dnsPreset">
            <option value="1.1.1.1, 1.0.0.1, 2606:4700:4700::1111, 2606:4700:4700::1001">Cloudflare</option>
            <option value="83.220.169.155, 212.109.195.93">Comss.one</option>
            <option value="111.88.96.50, 111.88.96.51">Xbox DNS</option>
            <option value="9.9.9.9, 149.112.112.112">Quad9</option>
            <option value="8.8.8.8, 8.8.4.4">Google</option>
          </select>
        </label>
      </div>

      <details>
        <summary>Дополнительные настройки</summary>
        <div class="grid two details-grid">
          <label>Endpoint IP
            <input id="endpointIp" value="162.159.192.1" />
          </label>

          <label>UDP порт
            <select id="warpPort">
              <option value="2408" selected>2408</option>
              <option value="500">500</option>
              <option value="1701">1701</option>
              <option value="4500">4500</option>
            </select>
          </label>

          <label>MTU
            <input id="mtu" type="number" min="576" max="1500" value="1280" />
          </label>

          <label>Keepalive
            <input id="keepalive" type="number" min="0" max="3600" value="25" />
          </label>
        </div>
      </details>

      <button id="generateBtn" class="primary">Создать конфиг</button>
      <div id="status" class="status hidden" role="status"></div>
      <div id="error" class="error hidden" role="alert"></div>
    </section>

    <section id="result" class="card hidden">
      <div class="result-head">
        <h2>warp-amnezia.conf</h2>
        <div class="pill" id="accountType">WARP</div>
      </div>

      <div class="meta-grid">
        <div><span>IPv4</span><strong id="ipv4">—</strong></div>
        <div><span>IPv6</span><strong id="ipv6">—</strong></div>
        <div><span>Endpoint</span><strong id="endpoint">—</strong></div>
        <div><span>Device ID</span><strong id="deviceId">—</strong></div>
      </div>

      <textarea id="config" rows="13" spellcheck="false" readonly></textarea>

      <div class="actions">
        <button id="downloadBtn" class="primary">Скачать .conf</button>
        <button id="copyBtn">Копировать</button>
        <button id="clearBtn" class="danger">Очистить</button>
      </div>
    </section>
  </main>

  <script src="/wireguard.js?v=20260910-minimal1"></script>
  <script src="/client.js?v=20260910-minimal1"></script>
</body>
</html>
