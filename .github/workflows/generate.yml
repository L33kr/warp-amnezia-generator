name: Generate WARP config

on:
  workflow_dispatch:
    inputs:
      route_mode:
        description: Routing mode
        type: choice
        required: true
        default: full
        options:
          - full
          - ipv4
      dns:
        description: DNS preset
        type: choice
        required: true
        default: cloudflare
        options:
          - cloudflare
          - quad9
          - google
      mtu:
        description: MTU
        required: true
        default: '1280'
      keepalive:
        description: PersistentKeepalive (0 disables)
        required: true
        default: '25'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WireGuard tools
        run: sudo apt-get update && sudo apt-get install -y wireguard-tools jq
      - name: Generate WARP config
        env:
          WARP_MTU: ${{ inputs.mtu }}
          WARP_KEEPALIVE: ${{ inputs.keepalive }}
        run: |
          case "${{ inputs.dns }}" in
            quad9) export WARP_DNS='9.9.9.9, 149.112.112.112' ;;
            google) export WARP_DNS='8.8.8.8, 8.8.4.4' ;;
            *) export WARP_DNS='1.1.1.1, 1.0.0.1, 2606:4700:4700::1111, 2606:4700:4700::1001' ;;
          esac

          if [ "${{ inputs.route_mode }}" = "ipv4" ]; then
            export WARP_ALLOWED_IPS='0.0.0.0/0'
            export WARP_INCLUDE_IPV6='0'
            if [ "${{ inputs.dns }}" = "cloudflare" ]; then
              export WARP_DNS='1.1.1.1, 1.0.0.1'
            fi
          fi

          ./scripts/generate.sh

      - name: Upload config
        uses: actions/upload-artifact@v4
        with:
          name: warp-amnezia-config
          path: warp-amnezia.conf
          if-no-files-found: error
          retention-days: 1

      - name: Usage instructions
        run: |
          {
            echo '## WARP config готов'
            echo ''
            echo 'Скачай **warp-amnezia-config** в разделе Artifacts этого запуска.'
            echo 'Внутри находится `warp-amnezia.conf` для импорта в AmneziaVPN как WireGuard.'
            echo ''
            echo '> Не публикуй файл конфигурации: он содержит приватный ключ.'
          } >> "$GITHUB_STEP_SUMMARY"
